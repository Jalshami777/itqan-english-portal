name: Build Web & Android APK on GitHub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-web-and-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17 for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build static Next.js app
        run: |
          if [ -f "page.tsx" ]; then
            mkdir -p app
            mv page.tsx app/page.tsx
            mv layout.tsx app/layout.tsx || true
            mv globals.css app/globals.css || true
          fi
          npm install
          npm run build

      - name: Prepare Capacitor Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itqan-english-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
